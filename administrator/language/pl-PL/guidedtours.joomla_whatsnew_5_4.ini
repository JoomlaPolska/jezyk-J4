COM_GUIDEDTOURS_TOUR_WHATSNEW_5_4_DESCRIPTION="<h1 class=\"fw-medium\">Witaj w Joomla 5.4!</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_4/automated-updates.jpg\" alt=\"Pokazuje powiadomienie w administracji gdzie możesz zobaczyć ikonę automatycznych aktualizacji aby je włączyć\" width=\"774\" height=\"281\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Automatyczne Aktualizacje już tu są!</h2><p>Joomla! 5.4 wspiera od teraz automatyczne aktualizacje dla lepszego bezpieczeństwa i wydajności.</p><p><a href=\"index.php?option=com_config&view=component&component=com_joomlaupdate#automated-updates\" class=\"btn btn-warning\">Włącz automatyczne aktualizacje już teraz</a></p><p><strong>Dbaj o swoje bezpieczeństwo!</strong></p></div></div>"
